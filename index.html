<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0e13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pocket Player">
  <title>Pocket Player</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <button id="backBtn" class="icon-btn hidden" aria-label="Back"></button>
      <h1 id="title">Songs</h1>
      <label class="add-btn" title="Add music from Files">
        <span>+ Add</span>
        <input id="fileInput" type="file" multiple
               accept="audio/*,.mp3,.m4a,.aac,.flac,.wav,.aif,.aiff,.ogg,.opus" hidden>
      </label>
    </div>
    <input id="search" type="search" placeholder="Search your library" autocomplete="off">
  </header>

  <div id="installTip" class="install-tip hidden">
    <span>Tip: tap <b>Share</b> → <b>Add to Home Screen</b> so your music stays saved and keeps playing in the background.</span>
    <button id="installTipClose" class="icon-btn" aria-label="Dismiss">✕</button>
  </div>

  <main id="main"></main>

  <div id="mini" class="mini hidden" role="button" aria-label="Open player">
    <img id="miniArt" class="art sm" alt="">
    <div class="mini-text">
      <div id="miniTitle" class="ellipsis"></div>
      <div id="miniArtist" class="ellipsis muted"></div>
    </div>
    <button id="miniPlay" class="icon-btn" aria-label="Play/Pause"></button>
    <button id="miniNext" class="icon-btn" aria-label="Next"></button>
    <div class="mini-progress"><div id="miniBar"></div></div>
  </div>

  <nav class="tabs">
    <button data-tab="songs">Songs</button>
    <button data-tab="albums">Albums</button>
    <button data-tab="artists">Artists</button>
    <button data-tab="playlists">Playlists</button>
    <button data-tab="get">Get Music</button>
  </nav>

  <section id="player" class="player hidden" aria-label="Now playing">
    <div class="player-top">
      <button id="playerClose" class="icon-btn" aria-label="Close player"></button>
      <span class="muted small">Now Playing</span>
      <button id="queueBtn" class="icon-btn" aria-label="Up next"></button>
    </div>
    <img id="playerArt" class="art xl" alt="">
    <div class="player-meta">
      <div id="playerTitle" class="ellipsis big"></div>
      <div id="playerArtist" class="ellipsis muted"></div>
    </div>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
    <div class="times muted small"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
    <div class="controls">
      <button id="shuffleBtn" class="icon-btn" aria-label="Shuffle"></button>
      <button id="prevBtn" class="icon-btn lg" aria-label="Previous"></button>
      <button id="playBtn" class="play-btn" aria-label="Play/Pause"></button>
      <button id="nextBtn" class="icon-btn lg" aria-label="Next"></button>
      <button id="repeatBtn" class="icon-btn" aria-label="Repeat"></button>
    </div>
  </section>

  <div id="sheetBackdrop" class="sheet-backdrop hidden"></div>
  <div id="sheet" class="sheet hidden"></div>
  <div id="toast" class="toast hidden"></div>
  <audio id="audio" preload="auto" playsinline></audio>

  <script src="app.js"></script>
</body>
</html>
